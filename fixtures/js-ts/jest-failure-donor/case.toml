schema = 1
id = "jest-failure-donor"
kind = "profile"

[observation]
source = "shell"
command = "jest"
shell_dialect = "unknown"
termination = "exited"
exit_code = 1
completeness = "complete"
presentation = "unknown"

[expect]
decision = "reduced"
profile = "jest"
golden = "expected.txt"
required_literals = ["FAIL src/api.test.js", "AssertionError: Expected status 200 but got 404", "Test Suites: 1 passed, 1 failed, 2 total", "Tests:       2 passed, 1 failed, 1 skipped, 4 total"]
forbidden_literals = ["PASS src/utils.test.js", "should add numbers", "Time:        1.5 s"]
properties = ["non_expanding", "idempotent", "preserves_required_literals"]

[preservation]
mandatory_signal_ids = ["jest-failure-0", "jest-suites-summary", "jest-tests-summary"]
permitted_removals = ["passing_suite_rows", "passing_test_rows", "timing_chatter"]

[provenance]
kind = "donor"
source_repo = "dPeluChe/trs"
source_commit = "0175ae73f36709fd4a9242b2e431d026d6f82bb3"
source_path = "tests/fixture_data/jest_mixed.txt"
