[package]
name = "hugr-lean"
version = "0.1.0"
edition = "2021"
description = "Deterministic tool-output filtering for coding agents"

[lib]
name = "hugr_lean"
path = "src/lib.rs"

[[bin]]
name = "hugr-lean"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
toml = "0.8"
